[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "prep-a-fight"
version = "0.5.5"
description = "Analyze top Warcraft Logs and adapt your gear and cooldowns to a specific boss fight, with a local SimulationCraft."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "py7zr>=0.22",
    "pywebview>=5.0; sys_platform == 'win32'",
    "tzdata",  # Europe/Paris for the daily pack refresh (Windows has no IANA time zones)
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
paf = "paf.cli:main"

[project.gui-scripts]
prep-a-fight = "paf.desktop:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
paf = ["assets/*.ico"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "network: needs internet access",
    "simc: needs a local simc binary",
]
addopts = "-m 'not network and not simc'"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# HTML templates: long lines are clearer than split strings
"src/paf/prep_report.py" = ["E501"]
"src/paf/corpus/timeline.py" = ["E501"]
"src/paf/web.py" = ["E501"]
"src/paf/theme.py" = ["E501"]
"src/paf/briefing.py" = ["E501"]
"src/paf/simple.py" = ["E501"]
"src/paf/onboarding.py" = ["E501"]
"src/paf/locale/*.py" = ["E501"]
