[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "prep-a-fight"
version = "0.0.1"
description = "Analyze top Warcraft Logs and adapt your gear and cooldowns to a specific boss fight, with a local SimulationCraft."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "py7zr>=0.22",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
paf = "paf.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "network: needs internet access",
    "simc: needs a local simc binary",
]
addopts = "-m 'not network and not simc'"

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
